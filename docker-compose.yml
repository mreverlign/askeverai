services:
  postgres:
    image: postgres:16-alpine
    container_name: askeverai-postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d
      - ./db-seed:/seed:ro
    # Bind mounts often keep +x; with noexec that yields "bad interpreter: Permission denied".
    # Clearing +x makes the official entrypoint *source* the scripts instead of exec'ing them.
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod a-x /docker-entrypoint-initdb.d/*.sh 2>/dev/null || true
        exec /usr/local/bin/docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askeverai-backend
    env_file:
      - .env
    ports:
      - "${BACKEND_HOST_PORT}:8000"
    volumes:
      - ./data/indices:/app/data/indices
      - ./data/schemas:/app/data/schemas
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Askeverai-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: askeverai-frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_HOST_PORT}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
