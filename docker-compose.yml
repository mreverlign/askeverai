services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: askeverai-postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      # Postgres 18+ stores data under versioned dirs; mount the parent path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: CSV → Postgres + schema CSVs → RAG indices.
  # Run with: docker compose --profile seed up --build
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askeverai-seed
    env_file:
      - .env
    volumes:
      - ./data/olap:/app/data/olap:ro
      - ./data/oltp:/app/data/oltp:ro
      - ./olap:/app/olap:ro
      - ./oltp:/app/oltp:ro
      - ./data/schemas:/app/data/schemas:ro
      - ./data/indices:/app/data/indices
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/seed_docker.sh"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askeverai-backend
    env_file:
      - .env
    ports:
      - "${BACKEND_HOST_PORT}:8000"
    volumes:
      - ./data/indices:/app/data/indices
      - ./data/schemas:/app/data/schemas
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./Askeverai-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: askeverai-frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_HOST_PORT}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
